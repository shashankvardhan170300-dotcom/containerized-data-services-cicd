[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-service"
version = "0.1.0"
description = "Containerized data service with versioned data contracts, Kubernetes manifests and CI/CD."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<4",
    "pydantic>=2.6,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
